name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        version: [latest, v0.1.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
      - run: vitko version --output json
      - run: test -x "${{ steps.setup.outputs.path }}"
      - run: vitko runners pricing --fields price_micros_per_slot_minute

  disclosure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 .github/disclosure/scan.py
      - run: python3 .github/disclosure/scan.py --no-files --git-log HEAD
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: printf '%s\n%s\n%s\n' "$PR_TITLE" "$PR_BRANCH" "$PR_BODY" | python3 .github/disclosure/scan.py --text pull-request
